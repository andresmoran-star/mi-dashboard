<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Resultados - XIX</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-[#0b0f19] text-white min-h-screen p-6 font-sans">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Encabezado con Identidad XIX -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-800 pb-5 gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-[#e11d48] to-[#ff3b30] flex items-center justify-center text-white font-black text-xl shadow-lg shadow-rose-900/30">
          X
        </div>
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-[#f43f5e] via-[#ff3b30] to-orange-400">
            XIX · Dashboard de Resultados
          </h1>
          <p class="text-slate-400 text-sm">Consolidado: Ventas 2025 vs Ventas 2026 vs Proyección 2026</p>
        </div>
      </div>
      <div id="status" class="bg-rose-950/40 text-rose-300 px-4 py-2 rounded-lg border border-rose-800/40 text-xs font-semibold animate-pulse">
        ⏳ Cargando datos...
      </div>
    </div>

    <!-- Filtros y Buscador -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Buscador general</label>
        <input type="text" id="search" placeholder="🔍 Buscar por Cliente, Medio, Grupo..." 
          class="w-full bg-[#161f30] border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-[#f43f5e] transition text-sm">
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Centro de Costos</label>
        <select id="filterCC" class="w-full bg-[#161f30] border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-[#f43f5e] transition text-sm">
          <option value="">🏢 Todos los Centros de Costos</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Mes</label>
        <select id="filterMes" class="w-full bg-[#161f30] border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-[#f43f5e] transition text-sm">
          <option value="">🗓️ Todos los Meses</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Tipo / Año</label>
        <select id="filterTipo" class="w-full bg-[#161f30] border border-slate-800 text-white p-3 rounded-xl focus:outline-none focus:border-[#f43f5e] transition text-sm">
          <option value="">📂 Todos los Tipos</option>
        </select>
      </div>
    </div>

    <!-- Métricas Principales (KPIs con estética XIX) -->
    <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- Gráfico Combinado Principal (Único) -->
    <div class="bg-[#141c2e] p-6 rounded-2xl border border-slate-800/80 shadow-2xl">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-lg font-bold text-slate-100 flex items-center gap-2">
          <span class="inline-block w-3 h-3 rounded-full bg-[#f43f5e]"></span>
          Comparativo Mensual: Real 2025 / 2026 (Barras) vs Proyección (Línea)
        </h2>
      </div>
      <div class="h-96"><canvas id="chartComparativo"></canvas></div>
    </div>

    <!-- Tabla Dinámica Consolidada -->
    <div class="bg-[#141c2e] rounded-2xl border border-slate-800/80 overflow-hidden shadow-2xl">
      <div class="p-5 border-b border-slate-800 flex justify-between items-center">
        <h2 class="text-lg font-bold text-slate-100">Detalle de Registros Consolidados</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-[#0b0f19] text-slate-400 uppercase text-xs border-b border-slate-800 tracking-wider" id="table-head"></thead>
          <tbody class="divide-y divide-slate-800/60" id="table-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8yeQyrFEH3B94cy7Ov4Gf74x7l-rdDC1Uybt8qwfWsGS-n5y2R0bpyoMTJwcO9oXAdc6_xpqya5HC/pub?gid=347166102&single=true&output=csv";
    let globalData = [];
    let montoKey = "";
    let chartComparativoInstance = null;

    const MESES_ORDEN = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        globalData = results.data;
        
        if (!globalData || globalData.length === 0) {
          document.getElementById('status').innerText = "❌ No hay datos en la hoja";
          return;
        }

        const firstRowKeys = Object.keys(globalData[0]);
        montoKey = firstRowKeys.find(k => k.trim().toLowerCase().includes("monto")) || "Monto";

        document.getElementById('status').innerText = "🟢 Conectado a Google Sheets";
        document.getElementById('status').className = "bg-emerald-950/40 text-emerald-300 px-4 py-2 rounded-lg border border-emerald-800/40 text-xs font-semibold";

        populateFilters(globalData);
        renderDashboard(globalData);
      }
    });

    function parseMonto(val) {
      if (val === null || val === undefined) return 0;
      let str = String(val).trim();
      let isNegative = str.includes('-') || (str.startsWith('(') && str.endsWith(')'));
      
      str = str.replace(/[^0-9.,]/g, "");
      if (!str) return 0;

      if (str.includes(',') && str.includes('.')) {
        if (str.lastIndexOf(',') > str.lastIndexOf('.')) {
          str = str.replace(/\./g, '').replace(',', '.');
        } else {
          str = str.replace(/,/g, '');
        }
      } else if (str.includes(',')) {
        str = str.replace(',', '.');
      }

      let num = parseFloat(str) || 0;
      return isNegative ? -num : num;
    }

    function getKey(row, searchName) {
      const keys = Object.keys(row);
      const matchedKey = keys.find(k => k.trim().toLowerCase().includes(searchName.toLowerCase()));
      return matchedKey ? String(row[matchedKey]).trim() : String(row[searchName] || '').trim();
    }

    function populateFilters(data) {
      const selectMes = document.getElementById('filterMes');
      const selectTipo = document.getElementById('filterTipo');
      const selectCC = document.getElementById('filterCC');

      selectMes.innerHTML = '<option value="">🗓️ Todos los Meses</option>';
      selectTipo.innerHTML = '<option value="">📂 Todos los Tipos</option>';
      selectCC.innerHTML = '<option value="">🏢 Todos los Centros de Costos</option>';

      let mesesUnicos = [...new Set(data.map(r => getKey(r, "Mes")).filter(Boolean))];
      mesesUnicos.sort((a, b) => {
        let idxA = MESES_ORDEN.findIndex(m => a.toLowerCase().includes(m));
        let idxB = MESES_ORDEN.findIndex(m => b.toLowerCase().includes(m));
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return a.localeCompare(b);
      });

      const tiposUnicos = [...new Set(data.map(r => getKey(r, "Tipo") || getKey(r, "Año")).filter(Boolean))];
      const ccUnicos = [...new Set(data.map(r => getKey(r, "Centro de Costos") || getKey(r, "Centro")).filter(Boolean))];

      mesesUnicos.forEach(mes => {
        const option = document.createElement('option');
        option.value = mes;
        option.textContent = mes;
        selectMes.appendChild(option);
      });

      tiposUnicos.forEach(tipo => {
        const option = document.createElement('option');
        option.value = tipo;
        option.textContent = tipo;
        selectTipo.appendChild(option);
      });

      ccUnicos.forEach(cc => {
        const option = document.createElement('option');
        option.value = cc;
        option.textContent = cc;
        selectCC.appendChild(option);
      });
    }

    function getFilteredData() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const selectedMes = document.getElementById('filterMes').value;
      const selectedTipo = document.getElementById('filterTipo').value;
      const selectedCC = document.getElementById('filterCC').value;

      return globalData.filter(row => {
        const matchesSearch = Object.values(row).some(val => String(val).toLowerCase().includes(searchTerm));
        const rowMes = getKey(row, "Mes");
        const rowTipo = getKey(row, "Tipo") || getKey(row, "Año");
        const rowCC = getKey(row, "Centro de Costos") || getKey(row, "Centro");

        const matchesMes = !selectedMes || rowMes === selectedMes;
        const matchesTipo = !selectedTipo || rowTipo === selectedTipo;
        const matchesCC = !selectedCC || rowCC === selectedCC;

        return matchesSearch && matchesMes && matchesTipo && matchesCC;
      });
    }

    function renderDashboard(data) {
      // 1. KPIs
      const totalMonto = data.reduce((sum, row) => sum + parseMonto(row[montoKey]), 0);
      const totalRegistros = data.length;
      const promedio = totalRegistros > 0 ? (totalMonto / totalRegistros) : 0;
      const clientesUnicos = new Set(data.map(r => getKey(r, "Cliente")).filter(Boolean)).size;

      document.getElementById('kpis').innerHTML = `
        <div class="bg-[#141c2e] p-5 rounded-2xl border border-slate-800/80 shadow-lg border-l-4 border-l-[#f43f5e]">
          <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Monto Total</p>
          <p class="text-3xl font-extrabold text-white mt-2">$${totalMonto.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
        </div>
        <div class="bg-[#141c2e] p-5 rounded-2xl border border-slate-800/80 shadow-lg border-l-4 border-l-[#ff3b30]">
          <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Promedio por Registro</p>
          <p class="text-3xl font-extrabold text-rose-400 mt-2">$${promedio.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
        </div>
        <div class="bg-[#141c2e] p-5 rounded-2xl border border-slate-800/80 shadow-lg border-l-4 border-l-blue-500">
          <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Total Clientes</p>
          <p class="text-3xl font-extrabold text-blue-400 mt-2">${clientesUnicos}</p>
        </div>
        <div class="bg-[#141c2e] p-5 rounded-2xl border border-slate-800/80 shadow-lg border-l-4 border-l-amber-500">
          <p class="text-xs text-slate-400 uppercase font-bold tracking-wider">Total Registros</p>
          <p class="text-3xl font-extrabold text-amber-400 mt-2">${totalRegistros}</p>
        </div>
      `;

      renderTable(data);
      renderCharts(data);
    }

    function renderTable(data) {
      if (!data || data.length === 0) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="10" class="px-6 py-4 text-center text-slate-500">No hay registros que coincidan</td></tr>`;
        return;
      }
      const headers = Object.keys(data[0]);

      document.getElementById('table-head').innerHTML = `
        <tr>${headers.map(h => `<th class="px-6 py-4 font-bold text-slate-400">${h}</th>`).join('')}</tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-rose-950/10 transition">
          ${headers.map(h => {
            let cellValue = row[h] || '-';
            if (h === montoKey) {
              const parsedVal = parseMonto(cellValue);
              cellValue = `<span class="font-extrabold text-[#f43f5e]">$${parsedVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>`;
            }
            return `<td class="px-6 py-4">${cellValue}</td>`;
          }).join('')}
        </tr>
      `).join('');
    }

    function renderCharts(data) {
      let meses = [...new Set(globalData.map(r => getKey(r, "Mes")).filter(Boolean))];
      meses.sort((a, b) => {
        let idxA = MESES_ORDEN.findIndex(m => a.toLowerCase().includes(m));
        let idxB = MESES_ORDEN.findIndex(m => b.toLowerCase().includes(m));
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return a.localeCompare(b);
      });

      const data2025 = meses.map(mes => {
        return data
          .filter(r => getKey(r, "Mes") === mes && (getKey(r, "Tipo") === "2025" || getKey(r, "Año") === "2025"))
          .reduce((sum, r) => sum + parseMonto(r[montoKey]), 0);
      });

      const data2026 = meses.map(mes => {
        return data
          .filter(r => getKey(r, "Mes") === mes && (getKey(r, "Tipo") === "2026" || getKey(r, "Año") === "2026"))
          .reduce((sum, r) => sum + parseMonto(r[montoKey]), 0);
      });

      const dataProy = meses.map(mes => {
        return data
          .filter(r => {
            const t = (getKey(r, "Tipo") || getKey(r, "Año") || "").toLowerCase();
            return getKey(r, "Mes") === mes && (t.includes("proy") || t.includes("proyección") || t.includes("proyeccion"));
          })
          .reduce((sum, r) => sum + parseMonto(r[montoKey]), 0);
      });

      if (chartComparativoInstance) chartComparativoInstance.destroy();
      const ctxComp = document.getElementById('chartComparativo').getContext('2d');
      chartComparativoInstance = new Chart(ctxComp, {
        type: 'bar',
        data: {
          labels: meses,
          datasets: [
            {
              type: 'bar',
              label: 'Ventas 2025',
              data: data2025,
              backgroundColor: '#3b82f6', // Azul
              borderRadius: 6
            },
            {
              type: 'bar',
              label: 'Ventas 2026',
              data: data2026,
              backgroundColor: '#e11d48', // Rosa Magenta XIX
              borderRadius: 6
            },
            {
              type: 'line',
              label: 'Proyección 2026',
              data: dataProy,
              borderColor: '#ff3b30', // Rojo Coral XIX
              backgroundColor: '#ff3b30',
              borderWidth: 3,
              fill: false,
              tension: 0.3,
              pointRadius: 6,
              pointBackgroundColor: '#ffffff'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { 
            legend: { 
              position: 'top', 
              labels: { color: '#94a3b8', font: { weight: 'bold' } } 
            } 
          },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#1e293b' } }
          }
        }
      });
    }

    // Eventos
    document.getElementById('search').addEventListener('input', () => renderDashboard(getFilteredData()));
    document.getElementById('filterMes').addEventListener('change', () => renderDashboard(getFilteredData()));
    document.getElementById('filterTipo').addEventListener('change', () => renderDashboard(getFilteredData()));
    document.getElementById('filterCC').addEventListener('change', () => renderDashboard(getFilteredData()));
  </script>
</body>
</html>
