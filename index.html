<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financiero y Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-blue-400">📊 Dashboard de Resultados</h1>
        <p class="text-slate-400 text-sm">Monitoreo de Montos por Centro de Costos, Cliente, Marca y Mes</p>
      </div>
      <div id="status" class="bg-yellow-500/10 text-yellow-400 px-4 py-2 rounded-lg border border-yellow-500/20 text-sm animate-pulse">
        ⏳ Cargando datos...
      </div>
    </div>

    <!-- Métricas Principales (KPIs) -->
    <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- Secciones de Gráficos -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
        <h2 class="text-lg font-semibold text-slate-200 mb-4">💰 Monto Total por Mes</h2>
        <div class="h-64"><canvas id="chartMes"></canvas></div>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
        <h2 class="text-lg font-semibold text-slate-200 mb-4">🏷️ Distribución por Marca</h2>
        <div class="h-64"><canvas id="chartMarca"></canvas></div>
      </div>
    </div>

    <!-- Buscador -->
    <div class="flex flex-col md:flex-row gap-4">
      <input type="text" id="search" placeholder="🔍 Buscar por Cliente, Centro de Costos, Medio, Grupo..." 
        class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-lg focus:outline-none focus:border-blue-500 transition">
    </div>

    <!-- Tabla Dinámica -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-200">Detalle de Registros</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs border-b border-slate-700">
            <tr>
              <th class="px-6 py-4">Centro de Costos</th>
              <th class="px-6 py-4">Cliente</th>
              <th class="px-6 py-4">Medio</th>
              <th class="px-6 py-4">Marca</th>
              <th class="px-6 py-4">Grupo</th>
              <th class="px-6 py-4">Mes</th>
              <th class="px-6 py-4 text-right">Monto</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-slate-700/50" id="table-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8yeQyrFEH3B94cy7Ov4Gf74x7l-rdDC1Uybt8qwfWsGS-n5y2R0bpyoMTJwcO9oXAdc6_xpqya5HC/pub?gid=347166102&single=true&output=csv";
    let globalData = [];
    let chartMesInstance = null;
    let chartMarcaInstance = null;

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        globalData = results.data;
        
        if (!globalData || globalData.length === 0) {
          document.getElementById('status').innerText = "❌ No hay datos en la hoja";
          return;
        }

        document.getElementById('status').innerText = "🟢 Conectado a Google Sheets";
        document.getElementById('status').className = "bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-lg border border-emerald-500/20 text-sm";

        renderDashboard(globalData);
      }
    });

    function cleanNumber(val) {
      if (!val) return 0;
      let clean = String(val).replace(/[^0-9.-]+/g, "");
      return parseFloat(clean) || 0;
    }

    function renderDashboard(data) {
      // 1. Cálculos KPIs
      const totalMonto = data.reduce((sum, row) => sum + cleanNumber(row["Monto"]), 0);
      const totalRegistros = data.length;
      const promedio = totalRegistros > 0 ? (totalMonto / totalRegistros) : 0;
      const clientesUnicos = new Set(data.map(r => r["Cliente"]).filter(Boolean)).size;

      document.getElementById('kpis').innerHTML = `
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Monto Total</p>
          <p class="text-3xl font-bold text-emerald-400 mt-2">$${totalMonto.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Promedio por Registro</p>
          <p class="text-3xl font-bold text-blue-400 mt-2">$${promedio.toLocaleString('es-ES', {minimumFractionDigits: 2})}</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Total Clientes</p>
          <p class="text-3xl font-bold text-purple-400 mt-2">${clientesUnicos}</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Total Registros</p>
          <p class="text-3xl font-bold text-amber-400 mt-2">${totalRegistros}</p>
        </div>
      `;

      // 2. Renderizar Tabla
      renderTable(data);

      // 3. Renderizar Gráficos
      renderCharts(data);
    }

    function renderTable(data) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-700/30 transition">
          <td class="px-6 py-4">${row["Centro de Costos"] || '-'}</td>
          <td class="px-6 py-4 font-semibold text-white">${row["Cliente"] || '-'}</td>
          <td class="px-6 py-4">${row["Medio"] || '-'}</td>
          <td class="px-6 py-4">${row["Marca"] || '-'}</td>
          <td class="px-6 py-4">${row["Grupo"] || '-'}</td>
          <td class="px-6 py-4">${row["Mes"] || '-'}</td>
          <td class="px-6 py-4 text-right font-bold text-emerald-400">$${cleanNumber(row["Monto"]).toLocaleString('es-ES', {minimumFractionDigits: 2})}</td>
        </tr>
      `).join('');
    }

    function renderCharts(data) {
      // Agrupar Monto por Mes
      const porMes = {};
      // Agrupar Monto por Marca
      const porMarca = {};

      data.forEach(row => {
        const mes = row["Mes"] || "Sin Mes";
        const marca = row["Marca"] || "Sin Marca";
        const monto = cleanNumber(row["Monto"]);

        porMes[mes] = (porMes[mes] || 0) + monto;
        porMarca[marca] = (porMarca[marca] || 0) + monto;
      });

      // Gráfico de Meses (Barras)
      if (chartMesInstance) chartMesInstance.destroy();
      const ctxMes = document.getElementById('chartMes').getContext('2d');
      chartMesInstance = new Chart(ctxMes, {
        type: 'bar',
        data: {
          labels: Object.keys(porMes),
          datasets: [{
            label: 'Monto Total ($)',
            data: Object.values(porMes),
            backgroundColor: '#3b82f6'
          }]
        },
        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
      });

      // Gráfico de Marcas (Donut)
      if (chartMarcaInstance) chartMarcaInstance.destroy();
      const ctxMarca = document.getElementById('chartMarca').getContext('2d');
      chartMarcaInstance = new Chart(ctxMarca, {
        type: 'doughnut',
        data: {
          labels: Object.keys(porMarca),
          datasets: [{
            data: Object.values(porMarca),
            backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });
    }

    // Buscador interactivo
    document.getElementById('search').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase();
      const filtered = globalData.filter(row => 
        Object.values(row).some(val => String(val).toLowerCase().includes(term))
      );
      renderTable(filtered);
    });
  </script>
</body>
</html>
