<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Financiero y Ventas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen p-6">
  <div class="max-w-7xl mx-auto space-y-6">
    
    <!-- Encabezado -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 gap-4">
      <div>
        <h1 class="text-3xl font-bold text-blue-400">📊 Dashboard de Resultados y Comparativos</h1>
        <p class="text-slate-400 text-sm">Consolidado: Ventas 2025 vs Ventas 2026 vs Proyección 2026</p>
      </div>
      <div id="status" class="bg-yellow-500/10 text-yellow-400 px-4 py-2 rounded-lg border border-yellow-500/20 text-sm animate-pulse">
        ⏳ Cargando datos...
      </div>
    </div>

    <!-- Filtros y Buscador -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Buscador general</label>
        <input type="text" id="search" placeholder="🔍 Buscar por Cliente, Medio, Grupo..." 
          class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-lg focus:outline-none focus:border-blue-500 transition">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Filtrar por Centro de Costos</label>
        <select id="filterCC" class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-lg focus:outline-none focus:border-blue-500 transition">
          <option value="">🏢 Todos los Centros de Costos</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Filtrar por Mes</label>
        <select id="filterMes" class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-lg focus:outline-none focus:border-blue-500 transition">
          <option value="">🗓️ Todos los Meses</option>
        </select>
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Filtrar por Tipo / Año</label>
        <select id="filterTipo" class="w-full bg-slate-800 border border-slate-700 text-white p-3 rounded-lg focus:outline-none focus:border-blue-500 transition">
          <option value="">📂 Todos los Tipos</option>
        </select>
      </div>
    </div>

    <!-- Métricas Principales (KPIs) -->
    <div id="kpis" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4"></div>

    <!-- Gráfico Combinado Principal -->
    <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
      <h2 class="text-lg font-semibold text-slate-200 mb-4">📈 Comparativo Mensual: Real 2025 / 2026 (Barras) vs Proyección (Línea)</h2>
      <div class="h-80"><canvas id="chartComparativo"></canvas></div>
    </div>

    <!-- Secciones de Gráficos Secundarios -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
        <h2 class="text-lg font-semibold text-slate-200 mb-4">🏆 Top 10 Clientes</h2>
        <div class="h-72"><canvas id="chartTopClientes"></canvas></div>
      </div>
      <div class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-xl">
        <h2 class="text-lg font-semibold text-slate-200 mb-4">🏷️ Distribución por Marca</h2>
        <div class="h-72"><canvas id="chartMarca"></canvas></div>
      </div>
    </div>

    <!-- Tabla Dinámica -->
    <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-xl">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="text-lg font-semibold text-slate-200">Detalle de Registros Consolidados</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left text-sm text-slate-300">
          <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs border-b border-slate-700" id="table-head"></thead>
          <tbody class="divide-y divide-slate-700/50" id="table-body"></tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ8yeQyrFEH3B94cy7Ov4Gf74x7l-rdDC1Uybt8qwfWsGS-n5y2R0bpyoMTJwcO9oXAdc6_xpqya5HC/pub?gid=347166102&single=true&output=csv";
    let globalData = [];
    let montoKey = "";
    let chartComparativoInstance = null;
    let chartMarcaInstance = null;
    let chartTopClientesInstance = null;

    const MESES_ORDEN = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];

    Papa.parse(CSV_URL, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        globalData = results.data;
        
        if (!globalData || globalData.length === 0) {
          document.getElementById('status').innerText = "❌ No hay datos en la hoja";
          return;
        }

        const firstRowKeys = Object.keys(globalData[0]);
        montoKey = firstRowKeys.find(k => k.trim().toLowerCase().includes("monto")) || "Monto";

        document.getElementById('status').innerText = "🟢 Conectado a Google Sheets";
        document.getElementById('status').className = "bg-emerald-500/10 text-emerald-400 px-4 py-2 rounded-lg border border-emerald-500/20 text-sm";

        populateFilters(globalData);
        renderDashboard(globalData);
      }
    });

    function parseMonto(val) {
      if (val === null || val === undefined) return 0;
      let str = String(val).trim();
      let isNegative = str.includes('-') || (str.startsWith('(') && str.endsWith(')'));
      
      str = str.replace(/[^0-9.,]/g, "");
      if (!str) return 0;

      if (str.includes(',') && str.includes('.')) {
        if (str.lastIndexOf(',') > str.lastIndexOf('.')) {
          str = str.replace(/\./g, '').replace(',', '.');
        } else {
          str = str.replace(/,/g, '');
        }
      } else if (str.includes(',')) {
        str = str.replace(',', '.');
      }

      let num = parseFloat(str) || 0;
      return isNegative ? -num : num;
    }

    function getKey(row, searchName) {
      const keys = Object.keys(row);
      const matchedKey = keys.find(k => k.trim().toLowerCase().includes(searchName.toLowerCase()));
      return matchedKey ? String(row[matchedKey]).trim() : String(row[searchName] || '').trim();
    }

    function populateFilters(data) {
      const selectMes = document.getElementById('filterMes');
      const selectTipo = document.getElementById('filterTipo');
      const selectCC = document.getElementById('filterCC');

      // Limpiar opciones previas manteniendo la primera por defecto
      selectMes.innerHTML = '<option value="">🗓️ Todos los Meses</option>';
      selectTipo.innerHTML = '<option value="">📂 Todos los Tipos</option>';
      selectCC.innerHTML = '<option value="">🏢 Todos los Centros de Costos</option>';

      let mesesUnicos = [...new Set(data.map(r => getKey(r, "Mes")).filter(Boolean))];
      
      // Ordenar meses cronológicamente
      mesesUnicos.sort((a, b) => {
        let idxA = MESES_ORDEN.findIndex(m => a.toLowerCase().includes(m));
        let idxB = MESES_ORDEN.findIndex(m => b.toLowerCase().includes(m));
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return a.localeCompare(b);
      });

      const tiposUnicos = [...new Set(data.map(r => getKey(r, "Tipo") || getKey(r, "Año")).filter(Boolean))];
      const ccUnicos = [...new Set(data.map(r => getKey(r, "Centro de Costos") || getKey(r, "Centro")).filter(Boolean))];

      mesesUnicos.forEach(mes => {
        const option = document.createElement('option');
        option.value = mes;
        option.textContent = mes;
        selectMes.appendChild(option);
      });

      tiposUnicos.forEach(tipo => {
        const option = document.createElement('option');
        option.value = tipo;
        option.textContent = tipo;
        selectTipo.appendChild(option);
      });

      ccUnicos.forEach(cc => {
        const option = document.createElement('option');
        option.value = cc;
        option.textContent = cc;
        selectCC.appendChild(option);
      });
    }

    function getFilteredData() {
      const searchTerm = document.getElementById('search').value.toLowerCase();
      const selectedMes = document.getElementById('filterMes').value;
      const selectedTipo = document.getElementById('filterTipo').value;
      const selectedCC = document.getElementById('filterCC').value;

      return globalData.filter(row => {
        const matchesSearch = Object.values(row).some(val => String(val).toLowerCase().includes(searchTerm));
        const rowMes = getKey(row, "Mes");
        const rowTipo = getKey(row, "Tipo") || getKey(row, "Año");
        const rowCC = getKey(row, "Centro de Costos") || getKey(row, "Centro");

        const matchesMes = !selectedMes || rowMes === selectedMes;
        const matchesTipo = !selectedTipo || rowTipo === selectedTipo;
        const matchesCC = !selectedCC || rowCC === selectedCC;

        return matchesSearch && matchesMes && matchesTipo && matchesCC;
      });
    }

    function renderDashboard(data) {
      // 1. KPIs
      const totalMonto = data.reduce((sum, row) => sum + parseMonto(row[montoKey]), 0);
      const totalRegistros = data.length;
      const promedio = totalRegistros > 0 ? (totalMonto / totalRegistros) : 0;
      const clientesUnicos = new Set(data.map(r => getKey(r, "Cliente")).filter(Boolean)).size;

      document.getElementById('kpis').innerHTML = `
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Monto Total</p>
          <p class="text-3xl font-bold text-emerald-400 mt-2">$${totalMonto.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Promedio por Registro</p>
          <p class="text-3xl font-bold text-blue-400 mt-2">$${promedio.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Total Clientes</p>
          <p class="text-3xl font-bold text-purple-400 mt-2">${clientesUnicos}</p>
        </div>
        <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
          <p class="text-xs text-slate-400 uppercase font-semibold">Total Registros</p>
          <p class="text-3xl font-bold text-amber-400 mt-2">${totalRegistros}</p>
        </div>
      `;

      renderTable(data);
      renderCharts(data);
    }

    function renderTable(data) {
      if (!data || data.length === 0) {
        document.getElementById('table-body').innerHTML = `<tr><td colspan="10" class="px-6 py-4 text-center text-slate-500">No hay registros que coincidan</td></tr>`;
        return;
      }
      const headers = Object.keys(data[0]);

      document.getElementById('table-head').innerHTML = `
        <tr>${headers.map(h => `<th class="px-6 py-4">${h}</th>`).join('')}</tr>
      `;

      const tbody = document.getElementById('table-body');
      tbody.innerHTML = data.map(row => `
        <tr class="hover:bg-slate-700/30 transition">
          ${headers.map(h => {
            let cellValue = row[h] || '-';
            if (h === montoKey) {
              const parsedVal = parseMonto(cellValue);
              cellValue = `<span class="font-bold text-emerald-400">$${parsedVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>`;
            }
            return `<td class="px-6 py-4">${cellValue}</td>`;
          }).join('')}
        </tr>
      `).join('');
    }

    function renderCharts(data) {
      // Extraer y ordenar todos los meses presentes en los datos
      let meses = [...new Set(globalData.map(r => getKey(r, "Mes")).filter(Boolean))];
      meses.sort((a, b) => {
        let idxA = MESES_ORDEN.findIndex(m => a.toLowerCase().includes(m));
        let idxB = MESES_ORDEN.findIndex(m => b.toLowerCase().includes(m));
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        return a.localeCompare(b);
      });

      // Extraer datos por mes y por tipo/año
      const data2025 = meses.map(mes => {
        return data
          .filter(r => getKey(r, "Mes") === mes && (getKey(r, "Tipo") === "2025" || getKey(r, "Año") === "2025"))
          .reduce((sum, r) => sum + parseMonto(r[montoKey]), 0);
      });

      const data2026 = meses.map(mes => {
        return data
          .filter(r => getKey(r, "Mes") === mes && (getKey(r, "Tipo") === "2026" || getKey(r, "Año") === "2026"))
          .reduce((sum, r) => sum + parseMonto(r[montoKey]), 0);
      });

      const dataProy = meses.map(mes => {
        return data
          .filter(r => {
            const t = (getKey(r, "Tipo") || getKey(r, "Año") || "").toLowerCase();
            return getKey(r, "Mes") === mes && (t.includes("proy") || t.includes("proyección") || t.includes("proyeccion"));
          })
          .reduce((sum, r) => sum + parseMonto(r[montoKey]), 0);
      });

      // 1. Gráfico Combinado
      if (chartComparativoInstance) chartComparativoInstance.destroy();
      const ctxComp = document.getElementById('chartComparativo').getContext('2d');
      chartComparativoInstance = new Chart(ctxComp, {
        type: 'bar',
        data: {
          labels: meses,
          datasets: [
            {
              type: 'bar',
              label: 'Ventas 2025',
              data: data2025,
              backgroundColor: '#3b82f6'
            },
            {
              type: 'bar',
              label: 'Ventas 2026',
              data: data2026,
              backgroundColor: '#10b981'
            },
            {
              type: 'line',
              label: 'Proyección 2026',
              data: dataProy,
              borderColor: '#f59e0b',
              backgroundColor: '#f59e0b',
              borderWidth: 3,
              fill: false,
              tension: 0.3,
              pointRadius: 5
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'top', labels: { color: '#94a3b8' } } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });

      // 2. Gráfico por Marca
      const porMarca = {};
      const porCliente = {};

      data.forEach(row => {
        const marca = getKey(row, "Marca") || "Sin Marca";
        const cliente = getKey(row, "Cliente") || "Sin Cliente";
        const monto = parseMonto(row[montoKey]);

        porMarca[marca] = (porMarca[marca] || 0) + monto;
        porCliente[cliente] = (porCliente[cliente] || 0) + monto;
      });

      if (chartMarcaInstance) chartMarcaInstance.destroy();
      const ctxMarca = document.getElementById('chartMarca').getContext('2d');
      chartMarcaInstance = new Chart(ctxMarca, {
        type: 'doughnut',
        data: {
          labels: Object.keys(porMarca),
          datasets: [{
            data: Object.values(porMarca),
            backgroundColor: ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b']
          }]
        },
        options: { responsive: true, maintainAspectRatio: false }
      });

      // 3. Top 10 Clientes
      const topClientes = Object.entries(porCliente)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 10);

      if (chartTopClientesInstance) chartTopClientesInstance.destroy();
      const ctxTop = document.getElementById('chartTopClientes').getContext('2d');
      chartTopClientesInstance = new Chart(ctxTop, {
        type: 'bar',
        data: {
          labels: topClientes.map(item => item[0]),
          datasets: [{
            label: 'Monto Total ($)',
            data: topClientes.map(item => item[1]),
            backgroundColor: '#10b981'
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } }
        }
      });
    }

    // Eventos
    document.getElementById('search').addEventListener('input', () => renderDashboard(getFilteredData()));
    document.getElementById('filterMes').addEventListener('change', () => renderDashboard(getFilteredData()));
    document.getElementById('filterTipo').addEventListener('change', () => renderDashboard(getFilteredData()));
    document.getElementById('filterCC').addEventListener('change', () => renderDashboard(getFilteredData()));
  </script>
</body>
</html>
